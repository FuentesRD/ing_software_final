{% extends "base.html" %}

{% block titulo %}Iniciar sesión · Biblioteca{% endblock %}

{% block contenido %}
<div class="card mx-auto" style="max-width: 420px;">
    <div class="card-body">
        <h1 class="h3 mb-3">Iniciar sesión</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
        <p class="mt-3">
        <a href="{% url 'cuentas:recuperar' %}">
            ¿Olvidaste tu contraseña?
        </a>
    </p>
    </div>
</div>
{% endblock %}
