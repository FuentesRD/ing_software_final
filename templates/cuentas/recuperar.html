{% extends "base.html" %}

{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<h1 class="h3">Recuperar contraseña</h1>
<p>Escribe el correo asociado a tu cuenta.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">
        Solicitar enlace
    </button>
</form>

<a href="{% url 'cuentas:login' %}">Volver al login</a>
{% endblock %}
