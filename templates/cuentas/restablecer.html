{% extends "base.html" %}

{% block contenido %}
<h1 class="h3">Nueva contraseña</h1>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">
            Guardar contraseña
        </button>
    </form>
{% else %}
    <p>El enlace ya no es válido. Solicita uno nuevo.</p>
    <a href="{% url 'cuentas:recuperar' %}">
        Recuperar contraseña
    </a>
{% endif %}
{% endblock %}
