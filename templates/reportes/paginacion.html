{% if pagina.has_other_pages %}
<nav aria-label="Páginas de {{ parametro }}" class="mb-4">
    {% if pagina.has_previous %}
    <a href="?{{ filtros }}&amp;{{ parametro }}={{ pagina.previous_page_number }}">
        Anterior
    </a>
    {% endif %}

    <span>
        Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}
    </span>

    {% if pagina.has_next %}
    <a href="?{{ filtros }}&amp;{{ parametro }}={{ pagina.next_page_number }}">
        Siguiente
    </a>
    {% endif %}
</nav>
{% endif %}
